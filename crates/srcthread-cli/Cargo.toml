[package]
name = "srcthread-cli"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Sole PC entrypoint for srcthread (CLI, daemon, desktop, mcp)"
license.workspace = true

[[bin]]
name = "srcthread"
path = "src/main.rs"

[dependencies]
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
srcthread = { workspace = true }
srcthread-daemon = { workspace = true }
srcthread-desktop = { workspace = true, optional = true }
srcthread-mcp = { workspace = true }
toml_edit = { workspace = true }
usage-rs = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["desktop"]
# Rune GPU UI; needs system Wayland/Vulkan libs. CI builds with --no-default-features.
desktop = ["dep:srcthread-desktop"]
