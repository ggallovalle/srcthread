[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "crates/srcthread",
  "crates/srcthread-cli",
  "crates/srcthread-daemon",
  "crates/srcthread-mcp",
  "crates/srcthread-uniffi",
]
default-members = [
  "crates/srcthread",
  "crates/srcthread-cli",
  "crates/srcthread-daemon",
  "crates/srcthread-mcp",
  "crates/srcthread-uniffi",
]

[workspace.package]
version = "0.2.0"
authors = ["Gerson Gallo <ggallovalle@gmail.com>"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
directories = "6"
jsonc-parser = { version = "0.34", features = ["cst"] }
pretty_assertions = "1"
rmcp = { version = "3", features = ["macros", "schemars", "server", "transport-io"] }
rune = { git = "https://github.com/ggallovalle/rune.git", rev = "db5abf42130beb9f530b1947635f859958ce89ca" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srcthread = { path = "crates/srcthread" }
srcthread-daemon = { path = "crates/srcthread-daemon" }
srcthread-desktop = { path = "apps/desktop" }
srcthread-mcp = { path = "crates/srcthread-mcp" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml_edit = "0.22"
uniffi = "0.29"
usage-rs = "7"
