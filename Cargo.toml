[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "crates/srcthread",
  "crates/srcthread-cli",
  "crates/srcthread-daemon",
  "crates/srcthread-mcp",
  "crates/srcthread-uniffi",
]

[workspace.package]
authors = ["Gerson Gallo <ggallovalle@gmail.com>"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srcthread = { path = "crates/srcthread" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uniffi = "0.29"
usage-rs = "7"
