# Kotlin lint preferences aligned with journalit's detekt.yaml.
# Applied via the detekt Gradle plugin + ktlint wrapper.

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    allowedLines: 60
  LongParameterList:
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  ComplexCondition:
    allowedConditions: 4
  TooManyFunctions:
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 15
    allowedFunctionsPerEnum: 15
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  CyclomaticComplexMethod:
    allowedComplexity: 15
  NestedBlockDepth:
    allowedDepth: 4
  StringLiteralDuplication:
    active: true
    allowedDuplications: 3
    ignoreAnnotation: true
    allowedWithLengthLessThan: 5
    ignoreStringsRegex: '$^'

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Compose @Composable entry points conventionally use PascalCase
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

performance:
  SpreadOperator:
    active: true

potential-bugs:
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnusedUnaryOperator:
    active: true
  CastToNullableType:
    active: true

# https://detekt.dev/docs/rules/ktlint
ktlint:
  active: true
  code_style: intellij_idea
  indentStyle: space
  # Allowed when the CLI passes --auto-correct (detektFormat). The check path
  # omits that flag, which forces all autoCorrect values off regardless.
  autoCorrect: true
  Indentation:
    active: true
    indentSize: 4
  MaximumLineLength:
    active: true
    maxLineLength: 120
  NoWildcardImports:
    active: true
  NoUnusedImports:
    active: true
  NoTrailingSpaces:
    active: true
  NoMultipleSpaces:
    active: true
  ImportOrdering:
    active: true
  ModifierOrdering:
    active: true
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperators:
    active: true
  SpacingAroundDot:
    active: true
  SpacingAroundParens:
    active: true
  ChainWrapping:
    active: true
  CommentSpacing:
    active: true
  FinalNewline:
    active: true
  ParameterListWrapping:
    active: true
    maxLineLength: 120
  Wrapping:
    active: true
  ArgumentListWrapping:
    active: true
    maxLineLength: 120
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

style:
  MagicNumber:
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  AbstractClassCanBeConcreteClass:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  ForbiddenComment:
    active: false
