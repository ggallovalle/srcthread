[tools]
# GitHub Actions runners default rustup to `minimal` (no rustfmt/clippy).
# Pin components so `mise run check-ci` works the same locally and in CI.
rust = { version = "1.99.0", components = "rustfmt,clippy" }
hk = "2.8.1"
rumdl = "0.2.79"
tombi = "1.9.1"
usage = { version = "7.1.3", workflow = "publish-cli.yml" }

[env]
CARGO_TARGET_DIR = "{{config_root}}/target"

[tasks.lint]
description = "Format and static checks only (no tests; TDD-red friendly)"
run = "hk run lint --all"

# Same checks as `lint`, but calls the tools directly — no hk, no git status /
# tracked-file selection. Useful when the tree is dirty or files are untracked.
[tasks.lint-all]
description = "Lint/format-check the whole tree (no hk; ignores git state)"
run = [
  "cargo fmt --check --all",
  "mise run clippy-ci",
  "rumdl fmt --check --diff .",
  "rumdl check .",
  "tombi format --quiet --check --diff .",
  "mise run detekt",
]

# CI cargo matrix: PC libs + CLI without the rune desktop feature
# (GHA lacks Wayland/Vulkan link deps). Android APK is local-only.
# Full local GUI: `cargo build -p srcthread-cli` (default features).
[tasks."clippy-ci"]
description = "Clippy CI packages (no rune desktop / Android)"
run = [
  "cargo clippy -p srcthread -p srcthread-mcp -p srcthread-uniffi -p srcthread-cli --no-default-features --all-targets -- -D warnings",
]

[tasks."test-ci"]
description = "Test CI packages (no rune desktop / Android)"
run = [
  "cargo test -p srcthread -p srcthread-mcp -p srcthread-uniffi -p srcthread-cli --no-default-features",
]

[tasks."check-ci"]
description = "What GitHub Actions runs: lint (incl. clippy-ci) + test-ci"
run = [
  "hk run lint --all",
  "mise run test-ci",
]

[tasks.check]
description = "Full gate (same as check-ci / GitHub Actions)"
run = "mise run check-ci"

[tasks."pre-commit"]
description = "Run the hk pre-commit hook (lint/format only)"
run = "hk run pre-commit"

# `render:usage` is a file task: mise/tasks/render/usage
# (hk `render_usage` pre-commit step calls `mise run render:usage`).

[tasks.detekt]
description = "Run Android detekt (ktlint wrapper) via Gradle"
dir = "{{config_root}}"
run = """
# CI is Rust-only; GHA may set ANDROID_HOME to a partial SDK that breaks Gradle.
if [ "${CI:-}" = "true" ]; then
  echo "skip detekt (CI)"
  exit 0
fi
sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
if [ -z "$sdk" ] || [ ! -d "$sdk/platforms" ]; then
  echo "skip detekt (no usable Android SDK)"
  exit 0
fi
./gradlew :apps:android:detekt :ktpackages:srcthread:detekt
"""

[tasks."android-emulator"]
description = "Start the default Android emulator via android CLI (blocks until ready)"
run = [
  "android emulator start ${SRCTHREAD_AVD:-Pixel_9_API_37.2}",
]

# android-start lives in mise/tasks/android-start (file task with --emulator/--device).
