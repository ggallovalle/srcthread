# Wired for later automation. Deactivated: workflow_dispatch only — do NOT
# enable push/tags until scripts/publish-release.sh is retired.
#
# Primary path today:
#   scripts/publish-release.sh <version>
#
# This workflow is a sketch of the same matrix + packslip + APK steps so it
# can be turned on later without rediscovering the layout.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to finish (e.g. v0.1.0), or leave empty"
        required: false
        type: string

# Hard off-switch while the manual script owns releases. Remove this `if`
# (and optionally add `push: tags: ['v*']`) when enabling CI publishing.
jobs:
  noop:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "release workflow deactivated; use scripts/publish-release.sh"

  # --- Below is the intended future matrix (never runs while noop's sibling
  # jobs stay gated / this file keeps `if: false` on active jobs). ---

  build-pc:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            variant: default
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            variant: desktop
          - os: ubuntu-latest
            triple: aarch64-unknown-linux-gnu
            variant: default
          - os: macos-latest
            triple: aarch64-apple-darwin
            variant: default
          - os: macos-latest
            triple: aarch64-apple-darwin
            variant: desktop
          - os: macos-latest
            triple: x86_64-apple-darwin
            variant: default
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop link deps
        if: matrix.variant == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev
      - run: rustup target add ${{ matrix.triple }}
      - run: ./scripts/release-assets.sh
      - run: ./scripts/build-tarball.sh ${{ matrix.triple }} ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.triple }}-${{ matrix.variant }}
          path: dist/*.tar.gz

  build-android:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble release APK
        run: ./gradlew :apps:android:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/build/outputs/apk/release/*.apk

  packslip:
    if: false
    needs: [build-pc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage dist/
        run: |
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz' -exec cp -t dist {} +
          ./scripts/release-assets.sh
          DIST=1 ./scripts/release-assets.sh
      - uses: jdx/packslip@v1
        with:
          artifacts: dist/srcthread-*.tar.gz
          bin: srcthread
          resources: |
            cli-spec/usage=asset:dist/srcthread.usage.kdl
            completion/bash=asset:dist/srcthread.bash
            completion/zsh=asset:dist/srcthread.zsh
            completion/fish=asset:dist/srcthread.fish
            completion/powershell=asset:dist/srcthread.powershell
            man@linux=archive:srcthread/man/man1/srcthread.1
            man@darwin=archive:srcthread/man/man1/srcthread.1
